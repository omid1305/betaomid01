# ══════════════════════════════════════════════════════════════════════════
# OMID-IRAN PANEL — Build & Publish Docker Image to GHCR
# ══════════════════════════════════════════════════════════════════════════
# این workflow:
#   • روی push به main/master و تگ‌های v*.*.* اجرا می‌شه
#   • image رو برای دو پلتفرم می‌سازه: linux/amd64 + linux/arm64
#   • به GitHub Container Registry (ghcr.io) push می‌کنه
#   • cache لایه‌ها رو توی GitHub Actions نگه می‌داره (build سریع‌تر)
#   • SBOM + Provenance attestation تولید می‌کنه (امنیت زنجیره‌ی تامین)
# ══════════════════════════════════════════════════════════════════════════

name: Build & Publish Docker Image to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ── Checkout source ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Enable multi-arch builds (ARM64) ─────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ─────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Auto-generate tags & labels ──────────────────────────────────
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build & push ─────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
